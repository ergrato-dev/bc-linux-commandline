<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img">
  <title>Bootcamp Linux Command Line: Zero to Advanced</title>

  <rect width="900" height="280" fill="#0d1117" rx="12"/>

  <!-- Terminal window -->
  <rect x="32" y="24" width="500" height="232" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <circle cx="54" cy="44" r="5" fill="#f85149"/>
  <circle cx="72" cy="44" r="5" fill="#e3b341"/>
  <circle cx="90" cy="44" r="5" fill="#3fb950"/>

  <text x="282" y="49" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#7d8590" text-anchor="middle">bash — ubuntu-lab</text>

  <line x1="32" y1="62" x2="532" y2="62" stroke="#30363d" stroke-width="1"/>

  <text x="54" y="92" font-family="'SFMono-Regular',Consolas,monospace" font-size="15" fill="#3fb950">$ whoami</text>
  <text x="54" y="114" font-family="'SFMono-Regular',Consolas,monospace" font-size="15" fill="#f0f6fc">student</text>

  <text x="54" y="142" font-family="'SFMono-Regular',Consolas,monospace" font-size="15" fill="#3fb950">$ ps -eo pid,stat,cmd | grep toolkit</text>
  <text x="54" y="164" font-family="'SFMono-Regular',Consolas,monospace" font-size="15" fill="#58a6ff">4821 S   toolkit sys-snapshot</text>

  <text x="54" y="192" font-family="'SFMono-Regular',Consolas,monospace" font-size="15" fill="#3fb950">$ cat /etc/os-release | grep VERSION_ID</text>
  <text x="54" y="214" font-family="'SFMono-Regular',Consolas,monospace" font-size="15" fill="#e3b341">VERSION_ID="24.04"</text>

  <text x="54" y="242" font-family="'SFMono-Regular',Consolas,monospace" font-size="15" fill="#3fb950">$ _</text>

  <!-- Right: title block -->
  <text x="560" y="110" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="30" font-weight="700" fill="#f0f6fc">Linux Command Line</text>
  <text x="560" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" fill="#3fb950">Zero to Advanced</text>
  <text x="560" y="180" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#8b949e">20 semanas · 200 horas</text>
  <text x="560" y="202" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#8b949e">Ubuntu 24.04 LTS · apt · dnf · pacman</text>

  <rect x="560" y="222" width="12" height="12" rx="2" fill="#E95420"/>
  <text x="580" y="232" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#8b949e">Ubuntu</text>
  <rect x="650" y="222" width="12" height="12" rx="2" fill="#A80030"/>
  <text x="670" y="232" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#8b949e">Debian</text>
  <rect x="740" y="222" width="12" height="12" rx="2" fill="#10B981"/>
  <text x="760" y="232" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#8b949e">RHEL</text>
  <rect x="810" y="222" width="12" height="12" rx="2" fill="#1793D1"/>
  <text x="830" y="232" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#8b949e">Arch</text>
</svg>
