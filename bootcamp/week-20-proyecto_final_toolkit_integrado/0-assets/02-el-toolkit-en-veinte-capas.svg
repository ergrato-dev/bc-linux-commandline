<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>El toolkit en veinte capas: seis fases, cada una con los subcomandos que añadió, y la Semana 20 que los empaqueta y prueba</title>
  <rect width="900" height="420" fill="#0d1117"/>

  <text x="20" y="28" fill="#8b949e" font-size="13">Cada semana añadió una capa a toolkit.sh · la Semana 20 las empaqueta (release) y las prueba (selftest)</text>

  <rect x="20" y="45" width="130" height="270" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="85" y="70" fill="#3fb950" font-size="13" text-anchor="middle" font-weight="600">1 · Fundamentos</text>
  <text x="85" y="86" fill="#8b949e" font-size="11" text-anchor="middle">S01-04</text>
  <text x="85" y="116" fill="#f0f6fc" font-size="12" text-anchor="middle">doctor</text>
  <text x="85" y="138" fill="#f0f6fc" font-size="12" text-anchor="middle">inventory</text>
  <text x="85" y="160" fill="#f0f6fc" font-size="12" text-anchor="middle">organize</text>
  <text x="85" y="182" fill="#f0f6fc" font-size="12" text-anchor="middle">audit</text>

  <rect x="160" y="45" width="130" height="270" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="225" y="70" fill="#79c0ff" font-size="13" text-anchor="middle" font-weight="600">2 · Datos</text>
  <text x="225" y="86" fill="#8b949e" font-size="11" text-anchor="middle">S05-08</text>
  <text x="225" y="116" fill="#f0f6fc" font-size="12" text-anchor="middle">logreport</text>
  <text x="225" y="138" fill="#f0f6fc" font-size="12" text-anchor="middle">logscan</text>
  <text x="225" y="160" fill="#f0f6fc" font-size="12" text-anchor="middle">topcount</text>
  <text x="225" y="182" fill="#f0f6fc" font-size="12" text-anchor="middle">sumfield</text>

  <rect x="300" y="45" width="130" height="270" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="365" y="70" fill="#79c0ff" font-size="13" text-anchor="middle" font-weight="600">3 · Sistema</text>
  <text x="365" y="86" fill="#8b949e" font-size="11" text-anchor="middle">S09-12</text>
  <text x="365" y="116" fill="#f0f6fc" font-size="12" text-anchor="middle">finddupes</text>
  <text x="365" y="138" fill="#f0f6fc" font-size="12" text-anchor="middle">procwatch</text>
  <text x="365" y="160" fill="#f0f6fc" font-size="12" text-anchor="middle">acctaudit</text>
  <text x="365" y="182" fill="#f0f6fc" font-size="12" text-anchor="middle">pkgcheck</text>
  <text x="365" y="204" fill="#f0f6fc" font-size="12" text-anchor="middle">netcheck</text>

  <rect x="440" y="45" width="130" height="270" rx="8" fill="#161b22" stroke="#e3b341"/>
  <text x="505" y="70" fill="#e3b341" font-size="13" text-anchor="middle" font-weight="600">4 · Automatización</text>
  <text x="505" y="86" fill="#8b949e" font-size="11" text-anchor="middle">S13-16</text>
  <text x="505" y="116" fill="#f0f6fc" font-size="12" text-anchor="middle">snapshot</text>
  <text x="505" y="138" fill="#f0f6fc" font-size="12" text-anchor="middle">healthcheck</text>
  <text x="505" y="160" fill="#f0f6fc" font-size="12" text-anchor="middle">guard</text>
  <text x="505" y="182" fill="#f0f6fc" font-size="12" text-anchor="middle">schedule</text>

  <rect x="580" y="45" width="130" height="270" rx="8" fill="#161b22" stroke="#d2a8ff"/>
  <text x="645" y="70" fill="#d2a8ff" font-size="13" text-anchor="middle" font-weight="600">5 · Avanzado</text>
  <text x="645" y="86" fill="#8b949e" font-size="11" text-anchor="middle">S17-19</text>
  <text x="645" y="116" fill="#f0f6fc" font-size="12" text-anchor="middle">dotfiles</text>
  <text x="645" y="138" fill="#f0f6fc" font-size="12" text-anchor="middle">backup</text>
  <text x="645" y="160" fill="#f0f6fc" font-size="12" text-anchor="middle">harden</text>

  <rect x="720" y="45" width="160" height="270" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="800" y="70" fill="#3fb950" font-size="13" text-anchor="middle" font-weight="600">6 · Integración</text>
  <text x="800" y="86" fill="#8b949e" font-size="11" text-anchor="middle">S20</text>
  <text x="800" y="116" fill="#f0f6fc" font-size="12" text-anchor="middle">version</text>
  <text x="800" y="138" fill="#f0f6fc" font-size="12" text-anchor="middle">release build</text>
  <text x="800" y="160" fill="#f0f6fc" font-size="12" text-anchor="middle">release verify</text>
  <text x="800" y="182" fill="#f0f6fc" font-size="12" text-anchor="middle">selftest</text>

  <rect x="20" y="335" width="860" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="360" fill="#f0f6fc" font-size="13" text-anchor="middle">toolkit.sh  →  toolkit_1.0.0_all.deb  +  SHA256SUMS</text>
  <text x="450" y="380" fill="#8b949e" font-size="12" text-anchor="middle">un solo script, 23 subcomandos, un paquete instalable y una autoprueba que recorre varias fases</text>
</svg>
