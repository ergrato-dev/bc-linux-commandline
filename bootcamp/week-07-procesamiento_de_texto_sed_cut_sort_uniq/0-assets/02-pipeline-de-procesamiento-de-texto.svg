<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titulo-pipeline desc-pipeline">
  <title id="titulo-pipeline">Pipeline de ranking de frecuencia: sed, tr, cut, tr, sort, uniq -c, sort -rn</title>
  <desc id="desc-pipeline">Siete etapas encadenadas que transforman un archivo de eventos en un ranking de valores más frecuentes: limpiar comentarios y líneas vacías con sed, comprimir delimitadores con tr -s, extraer la columna con cut, normalizar mayúsculas con tr, agrupar con sort, contar con uniq -c, y ordenar el resultado final con sort -rn.</desc>

  <rect x="0" y="0" width="900" height="460" fill="#0d1117"/>

  <text x="450" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#f0f6fc" font-weight="bold">
    toolkit.sh topcount — un dato fluye por siete etapas
  </text>

  <g font-family="monospace" font-size="13">
    <!-- entrada -->
    <rect x="20" y="60" width="140" height="50" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="90" y="80" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="12">eventos.log</text>
    <text x="90" y="98" text-anchor="middle" fill="#f0f6fc" font-size="11">ROOT:login:ok</text>

    <!-- etapa 1: sed -->
    <rect x="180" y="60" width="100" height="50" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="230" y="80" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="12">sed</text>
    <text x="230" y="98" text-anchor="middle" fill="#f0f6fc" font-size="10">quita # y vacías</text>

    <!-- etapa 2: tr -s -->
    <rect x="300" y="60" width="90" height="50" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="345" y="80" text-anchor="middle" fill="#d2a8ff" font-family="sans-serif" font-size="12">tr -s</text>
    <text x="345" y="98" text-anchor="middle" fill="#f0f6fc" font-size="10">comprime :</text>

    <!-- etapa 3: cut -->
    <rect x="410" y="60" width="90" height="50" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="455" y="80" text-anchor="middle" fill="#79c0ff" font-family="sans-serif" font-size="12">cut -f1</text>
    <text x="455" y="98" text-anchor="middle" fill="#f0f6fc" font-size="10">columna 1</text>

    <!-- etapa 4: tr lower -->
    <rect x="520" y="60" width="90" height="50" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="565" y="80" text-anchor="middle" fill="#d2a8ff" font-family="sans-serif" font-size="12">tr lower</text>
    <text x="565" y="98" text-anchor="middle" fill="#f0f6fc" font-size="10">root → root</text>

    <!-- flechas -->
    <g stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#fl)">
      <line x1="160" y1="85" x2="178" y2="85"/>
      <line x1="280" y1="85" x2="298" y2="85"/>
      <line x1="390" y1="85" x2="408" y2="85"/>
      <line x1="500" y1="85" x2="518" y2="85"/>
    </g>
  </g>

  <g font-family="monospace" font-size="13">
    <!-- etapa 5: sort -->
    <rect x="300" y="160" width="90" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="345" y="180" text-anchor="middle" fill="#3fb950" font-family="sans-serif" font-size="12">sort</text>
    <text x="345" y="198" text-anchor="middle" fill="#f0f6fc" font-size="10">agrupa iguales</text>

    <!-- etapa 6: uniq -c -->
    <rect x="410" y="160" width="100" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="460" y="180" text-anchor="middle" fill="#3fb950" font-family="sans-serif" font-size="12">uniq -c</text>
    <text x="460" y="198" text-anchor="middle" fill="#f0f6fc" font-size="10">cuenta</text>

    <!-- etapa 7: sort -rn -->
    <rect x="530" y="160" width="100" height="50" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="580" y="180" text-anchor="middle" fill="#e3b341" font-family="sans-serif" font-size="12">sort -rn</text>
    <text x="580" y="198" text-anchor="middle" fill="#f0f6fc" font-size="10">rankea</text>

    <path d="M 565 110 C 565 135, 345 135, 345 158" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#fl)"/>
    <line x1="390" y1="185" x2="408" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
    <line x1="510" y1="185" x2="528" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  </g>

  <defs>
    <marker id="fl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- resultado final -->
  <g font-family="sans-serif">
    <rect x="680" y="140" width="190" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="775" y="165" text-anchor="middle" font-size="13" fill="#f0f6fc" font-weight="bold">ranking final</text>
    <text x="700" y="190" font-family="monospace" font-size="13" fill="#e3b341">4 root</text>
    <text x="700" y="212" font-family="monospace" font-size="13" fill="#8b949e">2 admin</text>
  </g>
  <line x1="630" y1="185" x2="678" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>

  <text x="450" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8b949e">
    Etapas 1-4: limpiar y preparar el dato · Etapas 5-7: agrupar, contar y ordenar
  </text>

  <g font-family="sans-serif" font-size="13" fill="#f85149">
    <text x="450" y="320" text-anchor="middle" font-weight="bold">La normalización (tr lower) va ANTES del sort —</text>
    <text x="450" y="340" text-anchor="middle">si va después, ROOT y root quedan separados y uniq los cuenta distinto.</text>
  </g>
</svg>
