<svg viewBox="0 0 900 364" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-exit d-exit">
  <title id="t-exit">Todas las salidas de un script pasan por el trap EXIT</title>
  <desc id="d-exit">Cuatro formas de acabar un script: salida normal o exit N, set -e al fallar un comando, una señal INT o TERM atrapada que hace exit 128+N, y kill -9 que el kernel ejecuta sin avisar. Las tres primeras ejecutan el trap EXIT, que guarda primero el código de salida, lo registra y borra el temporal, y luego el proceso termina limpio. Con KILL ningún trap corre. El trap EXIT se instala después de validar la entrada para que un error de uso no deje temporales.</desc>
  <defs><marker id="fl" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8b949e"/></marker></defs>
  <rect x="0" y="0" width="900" height="364" fill="#0d1117"/>
  <text x="450" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#f0f6fc" font-weight="bold">Todas las salidas de un script pasan por el trap EXIT</text>
  <rect x="20" y="60" width="300" height="62" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="36" y="84" text-anchor="start" font-family="sans-serif" font-size="13" fill="#3fb950" font-weight="bold">exit N / fin normal</text>
  <text x="36" y="106" text-anchor="start" font-family="sans-serif" font-size="11.5" fill="#f0f6fc">el script llega al final o llama a exit</text>
  <path d="M320,91 L420,150" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="20" y="136" width="300" height="62" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="36" y="160" text-anchor="start" font-family="sans-serif" font-size="13" fill="#f85149" font-weight="bold">set -e: un comando falla</text>
  <text x="36" y="182" text-anchor="start" font-family="sans-serif" font-size="11.5" fill="#f0f6fc">bash aborta con el código del comando</text>
  <path d="M320,167 L420,150" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="20" y="212" width="300" height="62" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="36" y="236" text-anchor="start" font-family="sans-serif" font-size="13" fill="#e3b341" font-weight="bold">INT / TERM (Ctrl+C, kill)</text>
  <text x="36" y="258" text-anchor="start" font-family="sans-serif" font-size="11.5" fill="#f0f6fc">trap señal: avisa y hace exit 128+N</text>
  <path d="M320,243 L420,150" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="20" y="288" width="300" height="62" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="36" y="312" text-anchor="start" font-family="sans-serif" font-size="13" fill="#8b949e" font-weight="bold">kill -9 (KILL)</text>
  <text x="36" y="334" text-anchor="start" font-family="sans-serif" font-size="11.5" fill="#f0f6fc">el kernel mata sin avisar: ningún trap corre</text>
  <rect x="420" y="96" width="200" height="110" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="520" y="122" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#79c0ff" font-weight="bold">trap guard_cleanup EXIT</text>
  <text x="520" y="148" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#f0f6fc">local rc=$?   ← lo primero</text>
  <text x="520" y="170" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#f0f6fc">registra el código rc</text>
  <text x="520" y="190" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#f0f6fc">rm -f "$GUARD_TMP"</text>
  <path d="M620,150 L680,150" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="682" y="110" width="198" height="82" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="781" y="138" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3fb950" font-weight="bold">el proceso termina</text>
  <text x="781" y="160" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#f0f6fc">sin dejar temporales</text>
  <text x="781" y="178" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#f0f6fc">y con el código registrado</text>
  <rect x="340" y="274" width="540" height="70" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="610" y="300" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#f85149" font-weight="bold">El trap EXIT no se instala hasta haber validado la entrada:</text>
  <text x="610" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f0f6fc">un error de uso (exit 1) no debe crear temporales ni escribir en el registro.</text>
</svg>
