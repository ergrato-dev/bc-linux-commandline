<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" role="img">
  <title>Los tres bits especiales: SUID, SGID y sticky, y donde aparecen en ls -l</title>

  <rect width="820" height="280" fill="#0d1117"/>

  <!-- SUID -->
  <rect x="40" y="30" width="230" height="180" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="155" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#f85149" font-weight="600">SUID</text>
  <text x="155" y="90" text-anchor="middle" font-family="'SFMono-Regular',monospace" font-size="20" fill="#f0f6fc">-rws r-x r-x</text>
  <text x="155" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">corre con los</text>
  <text x="155" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">privilegios del DUEÑO</text>
  <text x="155" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">ignorado en scripts</text>
  <text x="155" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">con shebang</text>

  <!-- SGID -->
  <rect x="295" y="30" width="230" height="180" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="410" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#e3b341" font-weight="600">SGID</text>
  <text x="410" y="90" text-anchor="middle" font-family="'SFMono-Regular',monospace" font-size="20" fill="#f0f6fc">-rwx r-s r-x</text>
  <text x="410" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">binario: corre con el</text>
  <text x="410" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">grupo dueño</text>
  <text x="410" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">directorio: archivos</text>
  <text x="410" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">nuevos heredan el grupo</text>

  <!-- sticky -->
  <rect x="550" y="30" width="230" height="180" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="665" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#3fb950" font-weight="600">Sticky bit</text>
  <text x="665" y="90" text-anchor="middle" font-family="'SFMono-Regular',monospace" font-size="20" fill="#f0f6fc">rwxrwxrwt</text>
  <text x="665" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">en un directorio</text>
  <text x="665" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">compartido (ej. /tmp):</text>
  <text x="665" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">solo el dueño borra</text>
  <text x="665" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">su propio archivo</text>

  <text x="410" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">Minúscula (s/t) = el bit x correspondiente también está activo. Mayúscula (S/T) = sin x, probable error de configuración.</text>
</svg>
