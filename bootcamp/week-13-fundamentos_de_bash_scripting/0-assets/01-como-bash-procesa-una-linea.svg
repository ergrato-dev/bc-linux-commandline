<svg viewBox="0 0 900 522" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-exp d-exp">
  <title id="t-exp">Las siete expansiones de bash y cómo las afectan las comillas</title>
  <desc id="d-exp">Tabla de siete etapas en el orden en que bash las aplica: llaves, tilde, variables, aritmética, sustitución de comandos, división en palabras y globbing. Para cada una se indica si ocurre sin comillas, con comillas dobles o con comillas simples. Las comillas simples impiden todas; las dobles permiten variables, aritmética y sustitución de comandos pero impiden la división en palabras y el globbing, que son las dos etapas que rompen un script cuando el valor contiene espacios.</desc>
  <defs><marker id="fl" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8b949e"/></marker></defs>
  <rect x="0" y="0" width="900" height="522" fill="#0d1117"/>
  <text x="450" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#f0f6fc" font-weight="bold">Cómo bash procesa una línea: siete expansiones, en este orden</text>
  <text x="60" y="66" text-anchor="start" font-family="sans-serif" font-size="11" fill="#8b949e">Etapa</text>
  <text x="250" y="66" text-anchor="start" font-family="sans-serif" font-size="11" fill="#8b949e">Qué hace</text>
  <text x="590" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8b949e">sin comillas</text>
  <text x="690" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8b949e">"dobles"</text>
  <text x="790" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8b949e">'simples'</text>
  <rect x="20" y="76" width="860" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="42" y="102" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3fb950" font-weight="bold">1</text>
  <text x="60" y="101" text-anchor="start" font-family="sans-serif" font-size="13" fill="#f0f6fc" font-weight="bold">Llaves</text>
  <text x="250" y="101" text-anchor="start" font-family="monospace" font-size="12" fill="#79c0ff">{a,b}  {1..3}</text>
  <text x="590" y="101" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3fb950" font-weight="bold">sí</text>
  <text x="690" y="101" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f85149" font-weight="bold">no</text>
  <text x="790" y="101" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f85149" font-weight="bold">no</text>
  <rect x="20" y="124" width="860" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="42" y="150" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3fb950" font-weight="bold">2</text>
  <text x="60" y="149" text-anchor="start" font-family="sans-serif" font-size="13" fill="#f0f6fc" font-weight="bold">Tilde</text>
  <text x="250" y="149" text-anchor="start" font-family="monospace" font-size="12" fill="#79c0ff">~  ~/bin</text>
  <text x="590" y="149" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3fb950" font-weight="bold">sí</text>
  <text x="690" y="149" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f85149" font-weight="bold">no</text>
  <text x="790" y="149" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f85149" font-weight="bold">no</text>
  <rect x="20" y="172" width="860" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="42" y="198" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3fb950" font-weight="bold">3</text>
  <text x="60" y="197" text-anchor="start" font-family="sans-serif" font-size="13" fill="#f0f6fc" font-weight="bold">Variables</text>
  <text x="250" y="197" text-anchor="start" font-family="monospace" font-size="12" fill="#79c0ff">$var  ${var:-x}</text>
  <text x="590" y="197" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3fb950" font-weight="bold">sí</text>
  <text x="690" y="197" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3fb950" font-weight="bold">sí</text>
  <text x="790" y="197" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f85149" font-weight="bold">no</text>
  <rect x="20" y="220" width="860" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="42" y="246" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3fb950" font-weight="bold">4</text>
  <text x="60" y="245" text-anchor="start" font-family="sans-serif" font-size="13" fill="#f0f6fc" font-weight="bold">Aritmética</text>
  <text x="250" y="245" text-anchor="start" font-family="monospace" font-size="12" fill="#79c0ff">$(( a + b ))</text>
  <text x="590" y="245" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3fb950" font-weight="bold">sí</text>
  <text x="690" y="245" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3fb950" font-weight="bold">sí</text>
  <text x="790" y="245" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f85149" font-weight="bold">no</text>
  <rect x="20" y="268" width="860" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="42" y="294" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3fb950" font-weight="bold">5</text>
  <text x="60" y="293" text-anchor="start" font-family="sans-serif" font-size="13" fill="#f0f6fc" font-weight="bold">Sustitución de comandos</text>
  <text x="250" y="293" text-anchor="start" font-family="monospace" font-size="12" fill="#79c0ff">$(date +%F)</text>
  <text x="590" y="293" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3fb950" font-weight="bold">sí</text>
  <text x="690" y="293" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3fb950" font-weight="bold">sí</text>
  <text x="790" y="293" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f85149" font-weight="bold">no</text>
  <rect x="20" y="316" width="860" height="40" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="42" y="342" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3fb950" font-weight="bold">6</text>
  <text x="60" y="341" text-anchor="start" font-family="sans-serif" font-size="13" fill="#f0f6fc" font-weight="bold">División en palabras</text>
  <text x="250" y="341" text-anchor="start" font-family="monospace" font-size="12" fill="#79c0ff">separa por espacios (IFS)</text>
  <text x="590" y="341" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3fb950" font-weight="bold">sí</text>
  <text x="690" y="341" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f85149" font-weight="bold">no</text>
  <text x="790" y="341" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f85149" font-weight="bold">no</text>
  <rect x="20" y="364" width="860" height="40" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="42" y="390" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3fb950" font-weight="bold">7</text>
  <text x="60" y="389" text-anchor="start" font-family="sans-serif" font-size="13" fill="#f0f6fc" font-weight="bold">Globbing</text>
  <text x="250" y="389" text-anchor="start" font-family="monospace" font-size="12" fill="#79c0ff">*  ?  [a-z]</text>
  <text x="590" y="389" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3fb950" font-weight="bold">sí</text>
  <text x="690" y="389" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f85149" font-weight="bold">no</text>
  <text x="790" y="389" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f85149" font-weight="bold">no</text>
  <rect x="20" y="416" width="860" height="40" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="450" y="441" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e3b341">Al final se quitan las comillas. Las etapas 6 y 7 (rojo) son las que rompen un script cuando el valor lleva espacios o *.</text>
  <rect x="20" y="464" width="860" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="450" y="489" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#3fb950" font-weight="bold">Las comillas dobles expanden $ pero no parten ni hacen globbing: "$var" es casi siempre lo correcto.</text>
</svg>
