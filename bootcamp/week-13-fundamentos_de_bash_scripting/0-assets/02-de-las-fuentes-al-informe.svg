<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-snap d-snap">
  <title id="t-snap">Cómo snapshot convierte las fuentes del sistema en un informe</title>
  <desc id="d-snap">Seis fuentes del sistema (os-release, uptime, meminfo, el recuento de procesos, df y uname/date/id) alimentan variables locales de cmd_snapshot. Una comparación numérica entre el uso del disco y el umbral fija el estado ok o alerta. Un here-doc construye el informe, que sin --salida va a la pantalla y con --salida se escribe en un archivo cuya ruta puede tener espacios. El código de salida es 0, 1 o 2.</desc>
  <defs><marker id="fl" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8b949e"/></marker></defs>
  <rect x="0" y="0" width="900" height="430" fill="#0d1117"/>
  <text x="450" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#f0f6fc" font-weight="bold">De las fuentes del sistema al informe de snapshot</text>
  <rect x="20" y="60" width="230" height="48" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="135" y="81" text-anchor="middle" font-family="monospace" font-size="12" fill="#d2a8ff">/etc/os-release</text>
  <text x="135" y="98" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#8b949e">variable: sistema</text>
  <path d="M250,84 L318,84" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="20" y="120" width="230" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="135" y="141" text-anchor="middle" font-family="monospace" font-size="12" fill="#58a6ff">/proc/uptime</text>
  <text x="135" y="158" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#8b949e">variable: dias</text>
  <path d="M250,144 L318,144" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="20" y="180" width="230" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="135" y="201" text-anchor="middle" font-family="monospace" font-size="12" fill="#58a6ff">/proc/meminfo</text>
  <text x="135" y="218" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#8b949e">variable: memoria_kb</text>
  <path d="M250,204 L318,204" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="20" y="240" width="230" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="135" y="261" text-anchor="middle" font-family="monospace" font-size="12" fill="#58a6ff">find /proc ...</text>
  <text x="135" y="278" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#8b949e">variable: procesos</text>
  <path d="M250,264 L318,264" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="20" y="300" width="230" height="48" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="135" y="321" text-anchor="middle" font-family="monospace" font-size="12" fill="#e3b341">df -P /</text>
  <text x="135" y="338" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#8b949e">variable: uso</text>
  <path d="M250,324 L318,324" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="20" y="360" width="230" height="48" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="135" y="381" text-anchor="middle" font-family="monospace" font-size="12" fill="#3fb950">uname · date · id</text>
  <text x="135" y="398" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#8b949e">variable: host, fecha, usuario</text>
  <path d="M250,384 L318,384" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="320" y="60" width="200" height="348" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="420" y="86" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f0f6fc" font-weight="bold">cmd_snapshot</text>
  <text x="420" y="108" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8b949e">variables locales</text>
  <text x="420" y="140" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#79c0ff">$(( memoria_kb / 1024 ))</text>
  <text x="420" y="160" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#79c0ff">${segundos%%.*}</text>
  <text x="420" y="180" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#79c0ff">${USER:-$(id -un)}</text>
  <rect x="340" y="206" width="160" height="64" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="420" y="230" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#e3b341">[[ uso -ge umbral ]]</text>
  <text x="420" y="250" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#f0f6fc">estado = ok | alerta</text>
  <rect x="340" y="290" width="160" height="100" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="420" y="314" text-anchor="middle" font-family="monospace" font-size="11" fill="#3fb950">informe=$(cat &lt;&lt;EOF</text>
  <text x="420" y="332" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e">... líneas ...</text>
  <text x="420" y="350" text-anchor="middle" font-family="monospace" font-size="11" fill="#3fb950">EOF</text>
  <text x="420" y="376" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#8b949e">here-doc con $ expandido</text>
  <path d="M520,200 L596,150" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  <path d="M520,340 L596,330" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="600" y="100" width="280" height="100" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="740" y="126" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#79c0ff" font-weight="bold">sin --salida</text>
  <text x="740" y="148" text-anchor="middle" font-family="monospace" font-size="11" fill="#f0f6fc">printf '%s\n' "$informe"</text>
  <text x="740" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8b949e">el informe va a la pantalla</text>
  <rect x="600" y="290" width="280" height="100" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="740" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#79c0ff" font-weight="bold">con --salida "ruta con espacios"</text>
  <text x="740" y="336" text-anchor="middle" font-family="monospace" font-size="11" fill="#f0f6fc">mkdir -p "$(dirname "$salida")"</text>
  <text x="740" y="356" text-anchor="middle" font-family="monospace" font-size="11" fill="#f0f6fc">printf ... &gt; "$salida"</text>
  <text x="740" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8b949e">cada expansión entre comillas</text>
  <rect x="600" y="214" width="280" height="60" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="740" y="238" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#f85149" font-weight="bold">código de salida</text>
  <text x="740" y="258" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#f0f6fc">0 = ok · 1 = uso inválido · 2 = alerta</text>
</svg>
