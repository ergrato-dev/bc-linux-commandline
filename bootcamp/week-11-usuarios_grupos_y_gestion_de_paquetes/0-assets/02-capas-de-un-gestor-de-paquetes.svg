<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titulo-gp desc-gp">
  <title id="titulo-gp">Las capas de un gestor de paquetes en las tres familias de distribuciones</title>
  <desc id="desc-gp">En Debian/Ubuntu y en RHEL/Fedora hay dos capas: un frontend (apt, dnf) que habla con los repositorios remotos y resuelve dependencias, y un backend (dpkg, rpm) que instala un archivo local y actualiza la base de datos local. En Arch, pacman hace las dos cosas en un solo binario. Las tres familias terminan en una base de datos local de paquetes instalados.</desc>
  <rect x="0" y="0" width="900" height="470" fill="#0d1117"/>
  <text x="450" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#f0f6fc" font-weight="bold">Dos capas en Debian y RHEL, una sola en Arch</text>
  <defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8b949e"/></marker></defs>
  <rect x="20" y="56" width="860" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="450" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f0f6fc" font-weight="bold">Repositorio remoto (índice + paquetes firmados)</text>
  <text x="450" y="96" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8b949e">archive.ubuntu.com · dl.rockylinux.org · mirror.pkgbuild.com</text>
  <text x="30" y="140" text-anchor="start" font-family="sans-serif" font-size="13" fill="#e3b341" font-weight="bold">Debian / Ubuntu</text>
  <path d="M155,108 L155,152" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="20" y="156" width="270" height="76" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="155" y="182" text-anchor="middle" font-family="monospace" font-size="16" fill="#79c0ff">apt</text>
  <text x="155" y="206" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#f0f6fc">resuelve dependencias, descarga,</text>
  <text x="155" y="220" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#f0f6fc">instala en orden</text>
  <path d="M155,232 L155,256" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="20" y="260" width="270" height="76" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="155" y="286" text-anchor="middle" font-family="monospace" font-size="16" fill="#3fb950">dpkg</text>
  <text x="155" y="310" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#f0f6fc">instala UN archivo .deb, sin mirar</text>
  <text x="155" y="324" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#f0f6fc">repositorios</text>
  <path d="M155,336 L155,360" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="20" y="364" width="270" height="48" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="155" y="384" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#8b949e">base local de paquetes instalados</text>
  <text x="155" y="401" text-anchor="middle" font-family="monospace" font-size="11" fill="#d2a8ff">/var/lib/dpkg/status</text>
  <text x="320" y="140" text-anchor="start" font-family="sans-serif" font-size="13" fill="#f85149" font-weight="bold">RHEL / Fedora</text>
  <path d="M445,108 L445,152" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="310" y="156" width="270" height="76" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="445" y="182" text-anchor="middle" font-family="monospace" font-size="16" fill="#79c0ff">dnf</text>
  <text x="445" y="206" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#f0f6fc">resuelve dependencias, descarga,</text>
  <text x="445" y="220" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#f0f6fc">instala en orden</text>
  <path d="M445,232 L445,256" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="310" y="260" width="270" height="76" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="445" y="286" text-anchor="middle" font-family="monospace" font-size="16" fill="#3fb950">rpm</text>
  <text x="445" y="310" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#f0f6fc">instala UN archivo .rpm, sin mirar</text>
  <text x="445" y="324" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#f0f6fc">repositorios</text>
  <path d="M445,336 L445,360" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="310" y="364" width="270" height="48" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="445" y="384" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#8b949e">base local de paquetes instalados</text>
  <text x="445" y="401" text-anchor="middle" font-family="monospace" font-size="11" fill="#d2a8ff">/var/lib/rpm/rpmdb.sqlite</text>
  <text x="610" y="140" text-anchor="start" font-family="sans-serif" font-size="13" fill="#58a6ff" font-weight="bold">Arch</text>
  <path d="M735,108 L735,152" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="600" y="156" width="280" height="180" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="740" y="222" text-anchor="middle" font-family="monospace" font-size="16" fill="#79c0ff">pacman</text>
  <text x="740" y="248" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#f0f6fc">resuelve dependencias, descarga</text>
  <text x="740" y="263" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#f0f6fc">e instala: un solo binario, sin capa dpkg/rpm</text>
  <path d="M740,336 L740,360" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="600" y="364" width="280" height="48" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="740" y="384" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#8b949e">base local de paquetes instalados</text>
  <text x="740" y="401" text-anchor="middle" font-family="monospace" font-size="11" fill="#d2a8ff">/var/lib/pacman/local/</text>
  <rect x="20" y="428" width="860" height="30" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="450" y="448" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e3b341">Consultar «qué hay instalado» siempre pasa por la capa de abajo: dpkg -l · rpm -qa · pacman -Q</text>
</svg>
