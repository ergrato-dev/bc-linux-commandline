<svg viewBox="0 0 900 358" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-hc d-hc">
  <title id="t-hc">Flujo interno de healthcheck</title>
  <desc id="d-hc">Un array asociativo guarda un límite por comprobación y un array orden fija el orden por defecto; --solo lo sustituye por una lista partida por comas. Un bucle for recorre los nombres pedidos, cuenta el total y llama por nombre a la función hc_check_NOMBRE con su límite. La función imprime una línea y devuelve 0 si está bien o 1 si falla; el bucle cuenta los fallos. Al final se imprime el resumen y el script sale con 2 si hubo fallos o con 0 si no; los errores de uso salen antes con 1.</desc>
  <defs><marker id="fl" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8b949e"/></marker></defs>
  <rect x="0" y="0" width="900" height="358" fill="#0d1117"/>
  <text x="450" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#f0f6fc" font-weight="bold">Cómo healthcheck llega de las opciones al código de salida</text>
  <rect x="20" y="56" width="260" height="150" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="150" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#d2a8ff" font-weight="bold">Datos</text>
  <text x="36" y="104" text-anchor="start" font-family="monospace" font-size="11.5" fill="#f0f6fc">declare -A limite</text>
  <text x="36" y="122" text-anchor="start" font-family="monospace" font-size="11" fill="#8b949e">  disk=90 mem=128 procs=500</text>
  <text x="36" y="148" text-anchor="start" font-family="monospace" font-size="11.5" fill="#f0f6fc">orden=(disk mem procs)</text>
  <text x="36" y="172" text-anchor="start" font-family="monospace" font-size="11.5" fill="#e3b341">--solo mem,disk</text>
  <text x="36" y="190" text-anchor="start" font-family="monospace" font-size="11" fill="#e3b341">IFS=, read -ra pedidos</text>
  <path d="M280,130 L330,130" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="332" y="56" width="250" height="150" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="457" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#79c0ff" font-weight="bold">for nombre in pedidos</text>
  <text x="346" y="106" text-anchor="start" font-family="monospace" font-size="11.5" fill="#f0f6fc">total = total + 1</text>
  <text x="346" y="130" text-anchor="start" font-family="monospace" font-size="11.5" fill="#f0f6fc">if ! "hc_check_$nombre"</text>
  <text x="346" y="148" text-anchor="start" font-family="monospace" font-size="11.5" fill="#f0f6fc">     "${limite[$nombre]}"; then</text>
  <text x="346" y="170" text-anchor="start" font-family="monospace" font-size="11.5" fill="#f85149">  fallos = fallos + 1</text>
  <text x="346" y="190" text-anchor="start" font-family="monospace" font-size="11.5" fill="#f0f6fc">fi</text>
  <path d="M582,130 L632,130" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="634" y="56" width="246" height="150" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="757" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3fb950" font-weight="bold">Funciones hc_check_*</text>
  <text x="650" y="108" text-anchor="start" font-family="monospace" font-size="12" fill="#f0f6fc">hc_check_disk</text>
  <text x="650" y="130" text-anchor="start" font-family="monospace" font-size="12" fill="#f0f6fc">hc_check_mem</text>
  <text x="650" y="152" text-anchor="start" font-family="monospace" font-size="12" fill="#f0f6fc">hc_check_procs</text>
  <text x="650" y="182" text-anchor="start" font-family="sans-serif" font-size="11" fill="#8b949e">return 0 = ok  ·  return 1 = fallo</text>
  <text x="757" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8b949e">(y una línea con hc_line)</text>
  <path d="M457,208 L457,250" stroke="#8b949e" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="150" y="252" width="600" height="86" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="450" y="278" text-anchor="middle" font-family="monospace" font-size="13" fill="#e3b341">resumen: $(( total - fallos )) de $total ok</text>
  <text x="450" y="304" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#f0f6fc">fallos &gt; 0 → exit 2  ·  fallos = 0 → exit 0</text>
  <text x="450" y="326" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#8b949e">(los errores de uso salen antes, con exit 1)</text>
</svg>
