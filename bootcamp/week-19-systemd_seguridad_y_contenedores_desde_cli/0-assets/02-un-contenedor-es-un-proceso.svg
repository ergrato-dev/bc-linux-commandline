<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Un contenedor no es una máquina virtual: es un proceso del anfitrión con namespaces que limitan lo que ve y cgroups que limitan lo que consume</title>
  <rect width="900" height="380" fill="#0d1117"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
  </defs>

  <rect x="20" y="20" width="860" height="340" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="40" y="46" fill="#8b949e" font-size="13">anfitrión: un solo kernel, un solo árbol de procesos (ps -e en el anfitrión los ve todos)</text>

  <rect x="40" y="62" width="400" height="180" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="240" y="86" fill="#79c0ff" font-size="14" text-anchor="middle" font-weight="600">contenedor ubuntu-lab</text>
  <text x="60" y="112" fill="#f0f6fc" font-size="12">PID 1 dentro  =  sleep infinity</text>
  <text x="60" y="130" fill="#8b949e" font-size="12">otro PID fuera (docker inspect → .State.Pid)</text>
  <text x="60" y="158" fill="#f0f6fc" font-size="12">ve: su /, su red, su hostname, sus PIDs</text>
  <text x="60" y="176" fill="#f0f6fc" font-size="12">no ve: los procesos ni los archivos del anfitrión</text>
  <text x="60" y="204" fill="#3fb950" font-size="12">namespaces: pid · net · mnt · uts · ipc · cgroup · user</text>
  <text x="60" y="224" fill="#3fb950" font-size="12">cgroup: límites de CPU, memoria y nº de procesos</text>

  <rect x="470" y="62" width="390" height="180" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="665" y="86" fill="#f0f6fc" font-size="14" text-anchor="middle" font-weight="600">otros procesos del anfitrión</text>
  <text x="490" y="112" fill="#8b949e" font-size="12">systemd, dockerd, tu navegador, otros contenedores…</text>
  <text x="490" y="140" fill="#8b949e" font-size="12">comparten el mismo kernel que el contenedor</text>
  <text x="490" y="168" fill="#e3b341" font-size="12">por eso: un contenedor «privileged» o con</text>
  <text x="490" y="186" fill="#e3b341" font-size="12">--pid=host / --net=host rompe el aislamiento</text>

  <line x1="440" y1="150" x2="465" y2="150" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="262" width="820" height="78" rx="8" fill="#161b22" stroke="#d2a8ff"/>
  <text x="450" y="288" fill="#d2a8ff" font-size="14" text-anchor="middle" font-weight="600">kernel de Linux (compartido)</text>
  <text x="450" y="312" fill="#8b949e" font-size="12" text-anchor="middle">una máquina virtual lleva su propio kernel; un contenedor usa el del anfitrión</text>
  <text x="450" y="330" fill="#8b949e" font-size="12" text-anchor="middle">ls -l /proc/PID/ns  →  cada enlace es un namespace al que pertenece ese proceso</text>
</svg>
