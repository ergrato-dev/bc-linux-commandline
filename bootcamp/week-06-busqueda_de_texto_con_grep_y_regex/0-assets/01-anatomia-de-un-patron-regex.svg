<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titulo-regex desc-regex">
  <title id="titulo-regex">Anatomía de un patrón de regex: anclas, clases y cuantificador</title>
  <desc id="desc-regex">El patrón extendido ^ERROR: [0-9]{3}$ descompuesto en sus partes: ancla de inicio, texto literal, clase de caracteres, cuantificador y ancla de fin, cada una anotada con su significado.</desc>

  <rect x="0" y="0" width="900" height="420" fill="#0d1117"/>

  <text x="450" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#f0f6fc" font-weight="bold">
    Patrón: grep -E "^ERROR: [0-9]{3}$"
  </text>

  <!-- fila de tokens del patron -->
  <g font-family="monospace" font-size="28" font-weight="bold">
    <!-- ^ ancla inicio -->
    <rect x="60" y="90" width="50" height="60" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="85" y="130" text-anchor="middle" fill="#e3b341">^</text>

    <!-- ERROR: literal -->
    <rect x="120" y="90" width="190" height="60" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="215" y="130" text-anchor="middle" fill="#f0f6fc">ERROR:&#160;</text>

    <!-- [0-9] clase -->
    <rect x="320" y="90" width="110" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="375" y="130" text-anchor="middle" fill="#79c0ff">[0-9]</text>

    <!-- {3} cuantificador -->
    <rect x="440" y="90" width="80" height="60" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="480" y="130" text-anchor="middle" fill="#d2a8ff">{3}</text>

    <!-- $ ancla fin -->
    <rect x="530" y="90" width="50" height="60" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="555" y="130" text-anchor="middle" fill="#e3b341">$</text>
  </g>

  <!-- lineas guia hacia las anotaciones -->
  <g stroke-width="1.5" fill="none">
    <line x1="85" y1="150" x2="85" y2="190" stroke="#e3b341"/>
    <line x1="215" y1="150" x2="215" y2="190" stroke="#8b949e"/>
    <line x1="375" y1="150" x2="375" y2="190" stroke="#58a6ff"/>
    <line x1="480" y1="150" x2="480" y2="190" stroke="#d2a8ff"/>
    <line x1="555" y1="150" x2="555" y2="230" stroke="#e3b341"/>
  </g>

  <!-- anotaciones -->
  <g font-family="sans-serif" font-size="15">
    <text x="85" y="210" text-anchor="middle" fill="#e3b341">ancla: inicio</text>
    <text x="85" y="230" text-anchor="middle" fill="#8b949e">de línea</text>

    <text x="215" y="210" text-anchor="middle" fill="#f0f6fc">texto literal</text>
    <text x="215" y="230" text-anchor="middle" fill="#8b949e">("ERROR: " tal cual)</text>

    <text x="375" y="210" text-anchor="middle" fill="#79c0ff">clase de caracteres</text>
    <text x="375" y="230" text-anchor="middle" fill="#8b949e">un dígito del 0 al 9</text>

    <text x="480" y="210" text-anchor="middle" fill="#d2a8ff">cuantificador</text>
    <text x="480" y="230" text-anchor="middle" fill="#8b949e">repite 3 veces</text>

    <text x="555" y="250" text-anchor="middle" fill="#e3b341">ancla: fin</text>
    <text x="555" y="270" text-anchor="middle" fill="#8b949e">de línea</text>
  </g>

  <!-- ejemplos matcheados vs no -->
  <g font-family="monospace" font-size="18">
    <text x="60" y="330" fill="#3fb950">✓ ERROR: 502</text>
    <text x="60" y="360" fill="#f85149">✗ ERROR: 50</text>
    <text x="60" y="390" fill="#f85149">✗ error: 502 (sin -i, no matchea)</text>

    <text x="350" y="330" fill="#3fb950">— cumple linea completa</text>
    <text x="350" y="360" fill="#f85149">— solo 2 dígitos, {3} exige 3</text>
    <text x="350" y="390" fill="#f85149">— mayúsculas distintas</text>
  </g>
</svg>
