<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titulo-cmp desc-cmp">
  <title id="titulo-cmp">El pipeline de siete pasos de la Semana 07 comparado con un único programa awk</title>
  <desc id="desc-cmp">Arriba, los siete comandos encadenados de la semana pasada (sed, tr -s, cut, tr, sort, uniq -c, sort -rn). Abajo, el mismo resultado con un solo programa awk que usa NF como filtro, tolower como normalización, y un array asociativo como agrupación, seguido de un sort externo porque el orden de un array asociativo no está garantizado.</desc>

  <rect x="0" y="0" width="900" height="480" fill="#0d1117"/>

  <text x="450" y="35" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#f0f6fc" font-weight="bold">
    Mismo resultado, dos caminos
  </text>

  <!-- fila 1: pipeline de 7 pasos -->
  <text x="40" y="70" font-family="sans-serif" font-size="14" fill="#8b949e" font-weight="bold">Semana 07 — siete comandos encadenados</text>

  <g font-family="monospace" font-size="12">
    <rect x="40" y="85" width="90" height="40" rx="5" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
    <text x="85" y="109" text-anchor="middle" fill="#8b949e">sed</text>

    <rect x="140" y="85" width="90" height="40" rx="5" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
    <text x="185" y="109" text-anchor="middle" fill="#d2a8ff">tr -s</text>

    <rect x="240" y="85" width="90" height="40" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="285" y="109" text-anchor="middle" fill="#79c0ff">cut</text>

    <rect x="340" y="85" width="90" height="40" rx="5" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
    <text x="385" y="109" text-anchor="middle" fill="#d2a8ff">tr</text>

    <rect x="440" y="85" width="90" height="40" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="485" y="109" text-anchor="middle" fill="#3fb950">sort</text>

    <rect x="540" y="85" width="100" height="40" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="590" y="109" text-anchor="middle" fill="#3fb950">uniq -c</text>

    <rect x="650" y="85" width="100" height="40" rx="5" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="700" y="109" text-anchor="middle" fill="#e3b341">sort -rn</text>
  </g>

  <g stroke="#30363d" stroke-width="2" fill="none" marker-end="url(#fl2)">
    <line x1="130" y1="105" x2="138" y2="105"/>
    <line x1="230" y1="105" x2="238" y2="105"/>
    <line x1="330" y1="105" x2="338" y2="105"/>
    <line x1="430" y1="105" x2="438" y2="105"/>
    <line x1="530" y1="105" x2="538" y2="105"/>
    <line x1="640" y1="105" x2="648" y2="105"/>
  </g>

  <defs>
    <marker id="fl2" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#30363d"/>
    </marker>
  </defs>

  <text x="450" y="155" text-anchor="middle" font-family="monospace" font-size="14" fill="#f0f6fc">4 root   2 admin</text>

  <!-- separador -->
  <line x1="40" y1="185" x2="860" y2="185" stroke="#30363d" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="450" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8b949e">mismo resultado →</text>

  <!-- fila 2: awk unico -->
  <text x="40" y="250" font-family="sans-serif" font-size="14" fill="#8b949e" font-weight="bold">Semana 08 — un programa awk (+ sort externo, por el orden de for...in)</text>

  <g font-family="monospace" font-size="13">
    <rect x="40" y="265" width="820" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="60" y="290" fill="#79c0ff">awk -F: 'NF==3 { conteo[tolower($1)]++ }</text>
    <text x="60" y="310" fill="#79c0ff">           END { for (k in conteo) print conteo[k], k }' | sort -rn</text>
  </g>

  <g font-family="sans-serif" font-size="12" fill="#8b949e">
    <text x="60" y="350">NF==3</text>
    <text x="60" y="367">reemplaza a sed + tr -s + cut</text>

    <text x="420" y="350">tolower($1)</text>
    <text x="420" y="367">reemplaza a tr mayúsculas/minúsculas</text>

    <text x="650" y="350">conteo[]++</text>
    <text x="650" y="367">reemplaza a sort + uniq -c</text>
  </g>

  <text x="450" y="400" text-anchor="middle" font-family="monospace" font-size="14" fill="#f0f6fc">4 root   2 admin</text>

  <text x="450" y="440" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f85149" font-weight="bold">
    Más corto no siempre es más claro — elegí según lo que la tarea necesite, no por costumbre.
  </text>
</svg>
