<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" role="img">
  <title>Como bash resuelve un comando escrito en el prompt</title>

  <rect width="820" height="340" fill="#0d1117"/>

  <rect x="40" y="24" width="220" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="150" y="58" text-anchor="middle" font-family="'SFMono-Regular',monospace" font-size="15" fill="#3fb950">$ grep foo file.txt</text>

  <line x1="150" y1="80" x2="150" y2="110" stroke="#8b949e" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="40" y="112" width="220" height="56" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="150" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#f0f6fc">¿Es un builtin?</text>
  <text x="150" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">(cd, echo, type...)</text>

  <line x1="150" y1="168" x2="150" y2="198" stroke="#8b949e" stroke-width="2" marker-end="url(#a2)"/>
  <text x="170" y="188" font-family="system-ui,sans-serif" font-size="11" fill="#e3b341">no</text>

  <rect x="40" y="200" width="220" height="56" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="150" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#f0f6fc">¿Es un alias?</text>

  <line x1="150" y1="256" x2="150" y2="286" stroke="#8b949e" stroke-width="2" marker-end="url(#a2)"/>
  <text x="170" y="276" font-family="system-ui,sans-serif" font-size="11" fill="#e3b341">no</text>

  <rect x="40" y="288" width="220" height="40" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="150" y="312" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#f0f6fc">Buscar en $PATH, izq. a der.</text>

  <!-- PATH list -->
  <rect x="340" y="200" width="440" height="128" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="360" y="224" font-family="'SFMono-Regular',monospace" font-size="13" fill="#8b949e">$PATH =</text>
  <text x="360" y="246" font-family="'SFMono-Regular',monospace" font-size="13" fill="#f85149">/home/user/bin</text>
  <text x="470" y="246" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">← no tiene grep</text>
  <text x="360" y="268" font-family="'SFMono-Regular',monospace" font-size="13" fill="#f85149">/usr/local/bin</text>
  <text x="470" y="268" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">← no tiene grep</text>
  <text x="360" y="290" font-family="'SFMono-Regular',monospace" font-size="13" fill="#3fb950">/usr/bin</text>
  <text x="470" y="290" font-family="system-ui,sans-serif" font-size="11" fill="#3fb950">← encontrado: /usr/bin/grep ✓</text>
  <text x="360" y="312" font-family="'SFMono-Regular',monospace" font-size="13" fill="#8b949e">/bin</text>

  <line x1="260" y1="308" x2="338" y2="264" stroke="#8b949e" stroke-width="2" marker-end="url(#a2)"/>

  <text x="560" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e">Se detiene en la primera coincidencia.</text>
  <text x="560" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e">El orden de $PATH decide cuál "grep" corre.</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
