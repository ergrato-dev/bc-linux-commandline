<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img">
  <title>Pila: emulador de terminal, TTY, shell y kernel</title>

  <rect width="820" height="360" fill="#0d1117"/>

  <!-- Layer boxes, top to bottom -->
  <rect x="60" y="24" width="700" height="64" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="410" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#f0f6fc">Emulador de terminal (GNOME Terminal, iTerm2, Windows Terminal...)</text>
  <text x="410" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">Dibuja texto en una ventana. No interpreta comandos.</text>

  <rect x="60" y="112" width="700" height="64" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="410" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#f0f6fc">TTY / PTY (dispositivo /dev/pts/N)</text>
  <text x="410" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">Canal de E/S entre el emulador y el proceso que corre dentro.</text>

  <rect x="60" y="200" width="700" height="64" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="410" y="226" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#f0f6fc">bash (el shell)</text>
  <text x="410" y="248" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">Lee lo que escribís, lo interpreta, lanza procesos o ejecuta builtins.</text>

  <rect x="60" y="288" width="700" height="56" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="410" y="312" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#f0f6fc">Kernel de Linux</text>
  <text x="410" y="332" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">Procesos, archivos, permisos: todo pasa por syscalls al kernel.</text>

  <!-- arrows -->
  <line x1="410" y1="88" x2="410" y2="110" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="176" x2="410" y2="198" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="264" x2="410" y2="286" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
