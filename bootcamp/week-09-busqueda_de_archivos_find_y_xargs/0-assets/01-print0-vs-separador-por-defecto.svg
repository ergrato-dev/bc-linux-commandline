<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titulo-print0 desc-print0">
  <title id="titulo-print0">Por qué find -print0 y xargs -0 son seguros ante nombres de archivo con espacios</title>
  <desc id="desc-print0">Comparación byte por byte de cómo se separa el resultado "archivo con espacio.txt" usando salto de línea por defecto (se confunde con tres archivos) frente a usar un byte nulo con -print0 (se mantiene como un solo archivo).</desc>

  <rect x="0" y="0" width="900" height="420" fill="#0d1117"/>

  <text x="450" y="35" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#f0f6fc" font-weight="bold">
    Un archivo: "archivo con espacio.txt"
  </text>

  <text x="40" y="75" font-family="sans-serif" font-size="14" fill="#f85149" font-weight="bold">
    find (por defecto) | xargs — separador: espacio / salto de línea
  </text>

  <g font-family="monospace" font-size="15">
    <rect x="40" y="90" width="150" height="40" rx="5" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="115" y="115" text-anchor="middle" fill="#f0f6fc">archivo</text>

    <rect x="200" y="90" width="100" height="40" rx="5" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="250" y="115" text-anchor="middle" fill="#f0f6fc">con</text>

    <rect x="310" y="90" width="150" height="40" rx="5" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="385" y="115" text-anchor="middle" fill="#f0f6fc">espacio.txt</text>
  </g>

  <text x="40" y="150" font-family="sans-serif" font-size="13" fill="#f85149">
    xargs ve TRES argumentos → ls: no existe "archivo", "con", "espacio.txt"
  </text>

  <line x1="40" y1="180" x2="860" y2="180" stroke="#30363d" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="40" y="215" font-family="sans-serif" font-size="14" fill="#3fb950" font-weight="bold">
    find -print0 | xargs -0 — separador: byte nulo (\0)
  </text>

  <g font-family="monospace" font-size="15">
    <rect x="40" y="230" width="420" height="40" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="250" y="255" text-anchor="middle" fill="#f0f6fc">archivo con espacio.txt</text>
  </g>

  <rect x="465" y="230" width="36" height="40" rx="5" fill="#0d1117" stroke="#d2a8ff" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="483" y="255" text-anchor="middle" font-family="monospace" font-size="13" fill="#d2a8ff">\0</text>

  <text x="40" y="295" font-family="sans-serif" font-size="13" fill="#3fb950">
    xargs ve UN solo argumento → ls: archivo con espacio.txt (correcto)
  </text>

  <text x="450" y="340" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8b949e">
    \0 nunca puede aparecer dentro de un nombre de archivo válido en Linux —
  </text>
  <text x="450" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8b949e">
    por eso es el único separador verdaderamente seguro.
  </text>
</svg>
