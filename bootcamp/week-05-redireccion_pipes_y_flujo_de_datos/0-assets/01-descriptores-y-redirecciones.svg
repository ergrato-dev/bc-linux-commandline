<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" role="img">
  <title>Los tres descriptores de un proceso y adonde apuntan por defecto</title>

  <rect width="820" height="280" fill="#0d1117"/>

  <rect x="320" y="110" width="180" height="70" rx="10" fill="#161b22" stroke="#f0f6fc" stroke-width="2"/>
  <text x="410" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#f0f6fc">proceso</text>

  <!-- stdin -->
  <rect x="60" y="30" width="160" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="140" y="60" text-anchor="middle" font-family="'SFMono-Regular',monospace" font-size="14" fill="#58a6ff">0 · stdin</text>
  <line x1="220" y1="55" x2="320" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#a3)"/>
  <text x="140" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">teclado</text>

  <!-- stdout -->
  <rect x="600" y="30" width="160" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="680" y="60" text-anchor="middle" font-family="'SFMono-Regular',monospace" font-size="14" fill="#3fb950">1 · stdout</text>
  <line x1="600" y1="55" x2="500" y2="130" stroke="#3fb950" stroke-width="2" marker-end="url(#a3)"/>
  <text x="680" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">terminal</text>

  <!-- stderr -->
  <rect x="600" y="200" width="160" height="50" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="680" y="230" text-anchor="middle" font-family="'SFMono-Regular',monospace" font-size="14" fill="#f85149">2 · stderr</text>
  <line x1="600" y1="215" x2="500" y2="165" stroke="#f85149" stroke-width="2" marker-end="url(#a3)"/>
  <text x="680" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">tambien terminal, por defecto</text>

  <text x="410" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">stdout y stderr comparten destino visual,</text>
  <text x="410" y="228" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">pero son canales independientes</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
