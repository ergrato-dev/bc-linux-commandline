<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img">
  <title>Un pipeline con tee en el medio: guarda una copia y deja pasar el resto</title>

  <rect width="820" height="220" fill="#0d1117"/>

  <rect x="30" y="80" width="140" height="56" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="100" y="113" text-anchor="middle" font-family="'SFMono-Regular',monospace" font-size="13" fill="#58a6ff">cat log.txt</text>

  <line x1="170" y1="108" x2="230" y2="108" stroke="#8b949e" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="230" y="80" width="140" height="56" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="300" y="108" text-anchor="middle" font-family="'SFMono-Regular',monospace" font-size="13" fill="#e3b341">tee copia.log</text>

  <line x1="300" y1="136" x2="300" y2="180" stroke="#e3b341" stroke-width="2" marker-end="url(#a4)"/>
  <rect x="220" y="182" width="160" height="30" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="1"/>
  <text x="300" y="202" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#e3b341">copia.log (completo)</text>

  <line x1="370" y1="108" x2="430" y2="108" stroke="#8b949e" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="430" y="80" width="140" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="500" y="108" text-anchor="middle" font-family="'SFMono-Regular',monospace" font-size="13" fill="#3fb950">grep ERROR</text>

  <line x1="570" y1="108" x2="630" y2="108" stroke="#8b949e" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="630" y="80" width="150" height="56" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="705" y="108" text-anchor="middle" font-family="'SFMono-Regular',monospace" font-size="13" fill="#d2a8ff">pantalla</text>

  <text x="410" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#f0f6fc">cat log.txt | tee copia.log | grep ERROR</text>
  <text x="410" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">tee no corta el pipeline: guarda Y deja pasar el mismo contenido</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
